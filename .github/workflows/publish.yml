name: Publish BellaBaxter.Crypto to NuGet

# Triggered by tags of the form: v1.2.3  or  v1.2.3-preview.1
#
# To release a new version (after sync-crypto has pushed to this repo):
#   git tag v0.1.1
#   git push origin v0.1.1
#
# Required GitHub Secret:
#   NUGET_API_KEY  — API key from nuget.org with push scope for BellaBaxter.*

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        # Tag: v1.2.3  →  VERSION=1.2.3
        # Tag: v1.2.3-preview.1  →  VERSION=1.2.3-preview.1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore BellaBaxter.Crypto.csproj

      - name: Build
        run: |
          dotnet build BellaBaxter.Crypto.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack BellaBaxter.Crypto.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nuget-output

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbols to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.snupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        continue-on-error: true # snupkg push failure is non-fatal

  notify_slack:
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && needs.publish.result != 'skipped'
    steps:
      - uses: slackapi/slack-github-action@v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*BellaBaxter.Crypto NuGet publish*: ${{ needs.publish.result }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
