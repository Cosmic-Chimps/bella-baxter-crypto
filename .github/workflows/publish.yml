name: Publish BellaBaxter.Crypto to NuGet

# Triggered by tags of the form: v1.2.3  or  v1.2.3-preview.1
#
# To release a new version (after sync-crypto has pushed to this repo):
#   git tag v0.1.1
#   git push origin v0.1.1
#
# NuGet Trusted Publishing: no stored API key. NuGet/login exchanges this run's GitHub OIDC token for a
# short-lived key, which nuget.org grants only to the policy that names this repository (bella-baxter-crypto),
# this workflow file (publish.yml) and the package (BellaBaxter.Crypto), owned by `jjchiw`.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Pack & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing: the OIDC token NuGet/login exchanges

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # full history required for SourceLink

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.x'

      - name: Extract version from tag
        id: version
        # Tag: v1.2.3  →  VERSION=1.2.3
        # Tag: v1.2.3-preview.1  →  VERSION=1.2.3-preview.1
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Restore
        run: dotnet restore BellaBaxter.Crypto.csproj

      - name: Build
        run: |
          dotnet build BellaBaxter.Crypto.csproj \
            --configuration Release \
            --no-restore \
            -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: |
          dotnet pack BellaBaxter.Crypto.csproj \
            --configuration Release \
            --no-build \
            -p:Version=${{ steps.version.outputs.VERSION }} \
            --output ./nuget-output

      # Just before the push: the key it returns is short-lived.
      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: jjchiw

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.nupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push symbols to NuGet.org
        run: |
          dotnet nuget push ./nuget-output/*.snupkg \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        continue-on-error: true # snupkg push failure is non-fatal

  notify_slack:
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && needs.publish.result != 'skipped'
    steps:
      - uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            text: "${{ needs.publish.result == 'success' && '✅' || needs.publish.result == 'failure' && '❌' || '⚠️' }} *BellaBaxter.Crypto NuGet publish*: ${{ needs.publish.result }}\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
